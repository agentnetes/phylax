name: Bug report
description: Something is not working as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Do not paste tokens, the age private key or backup contents.** Security problems: use the private report link instead."
  - type: input
    id: version
    attributes: { label: "Version (`phylax version`) and OS", placeholder: "phylax 1.0.0, macOS 15" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce / output of `phylax doctor` (redacted), render: text }

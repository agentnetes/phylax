name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install age and rclone (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y age rclone
      - name: Install age and rclone (macOS)
        if: runner.os == 'macOS'
        run: brew install age rclone
      - name: Compile and syntax-check
        run: |
          python3 -m py_compile phylax.py
          for f in install.sh phylax.sh bootstrap.sh scripts/release.sh tests/smoke.sh; do bash -n "$f"; done
      - name: Smoke test (encrypt, snapshot, restore against a local remote)
        run: tests/smoke.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact
